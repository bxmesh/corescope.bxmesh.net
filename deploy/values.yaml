# corescope.bxmesh.net, in the namespace dmz-corescope: EMQX, the broker observers stream into
# (mqtt.bxmesh.net, its dashboard on mqtt-admin.bxmesh.net), and CoreScope (corescope.bxmesh.net),
# which reads it. Settings map cluster-01's dmz/services.yml (emqx, corescope-ingestor,
# corescope-server) one to one.

# false until the restore Job has copied emqx-data back (O163): EMQX stays at 0 replicas. The
# owner sets it to true by pull request once the restore has succeeded.
restored: true

# EMQX: exactly one pod, never two at once (its built-in database of logins must have exactly one
# writer). A StatefulSet, so a replacement starts only once the old pod is gone.
emqx:
  image:
    repository: ghcr.io/bxmesh/corescope.bxmesh.net/emqx
    tag: "9d48f41a4486e809bc9fd553b58916003489971c"  # CI writes the commit SHA here, on the pull request that changed emqx/ (O14)
  # cores: 2 and memory: 1024 in services.yml: caps, not reservations. The request is its use on
  # cluster-02 (2-3 November 2026, 16.5 h: p95 401 MiB, max 404 MiB) plus about a quarter.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # Users, admin accounts, sessions. New and empty; the restore Job copies cluster-01's
  # dmz/data/emqx into it (O163). Mounted at /opt/emqx/data.
  data:
    storageClassName: ceph-block
    size: 4Gi   # placeholder: the owner sets it from the measured folder size
    keep: true  # Argo never prunes or deletes the volume

# CoreScope: one pod with both processes, the ingestor and the server, sharing one volume (one
# SQLite writer). It starts fresh on its empty volume, reading only our broker: cluster-01's data
# isn't restored (the owner's decision of 28 October, replacing O94).
corescope:
  # true: its pod runs and corescope.bxmesh.net is routed; false: no pod, and no route (so
  # external-dns leaves corescope.bxmesh.net alone).
  restored: true
  image:
    repository: ghcr.io/bxmesh/corescope.bxmesh.net/corescope
    tag: "3048ed2a88dcb4f03154ce4c41e72e2bcf5476f8"  # CI writes the commit SHA here, on the pull request that changed corescope/ (O14)
  # The broker, in this namespace: plain MQTT, inside the cluster only.
  broker: mqtt://emqx:1883
  # Memory from their use on cluster-02 (2-3 November 2026, 16.5 h of Prometheus history): the
  # requests at about p95 plus a quarter, the limits well above the most either used. cluster-01's
  # caps (16384 and 32768) were more than the R430's whole 32 GB.
  ingestor:
    # Used at most 30 MiB (the SQLite page cache it writes through is reclaimed at the limit).
    # The limit stays above the image's GOMEMLIMIT of 2GiB (corescope/Dockerfile).
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        cpu: "2"
        memory: 4Gi  # the owner, 3 November: keep generous limits while the history is short
  server:
    # Used p95 852 MiB, max 871 MiB, with its packet store holding the last 7 days
    # (corescope/config.json, retentionHours 168): 267 MB for 41,966 packets on 3 November. The
    # store's own cap (maxMemoryMB 8192) bounds it. The limit stays above that cap, so the store
    # can fill to its designed size without the server being killed (the owner, 3 November: careful
    # not to trim too far; only 16.5 h of history so far). GOMEMLIMIT sits under the limit.
    gomemlimit: 9GiB
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        cpu: "2"
        memory: 10Gi
  # The SQLite database, the ingestor's stats file and its pre-upgrade backups. On cluster-01
  # it's on the T620's own disks (dmz_data), not CephFS.
  data:
    storageClassName: ceph-block
    size: 50Gi  # placeholder: the owner sets it from the measured folder size
    keep: true

# The Discord relay (discord/relay.py): posts each new message on these MeshCore channels, as
# CoreScope decodes them, to that channel's Discord webhook (the owner, 2 November 2026). It reads
# CoreScope's API inside this namespace. The webhook URLs are secrets: OpenBao,
# secret/dmz-corescope/discord, one key per channel (secretKey below).
discord:
  enabled: true
  image:
    repository: ghcr.io/bxmesh/corescope.bxmesh.net/discord
    tag: "f564bbaa57b7e2d911cecba22bd8819435847d22"  # CI writes the commit SHA here, on the pull request that changed discord/ (O14)
  # CoreScope's channel name (as /api/channels lists it) and the key of its webhook in OpenBao.
  channels:
    - {name: "#bathurst", secretKey: bathurst}   # Discord: #bathurst
    - {name: Public, secretKey: public}          # Discord: #nsw-public-traffic
  pollSeconds: 5
  # The last message posted on each channel, so a restart neither skips nor repeats.
  state:
    storageClassName: ceph-block
    size: 1Gi
    keep: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# The routes, on BxMesh's own gateway (O73).
route:
  gateway: bxmesh
  gatewayNamespace: platform-gateways
  sectionName: http
  mqttHostname: mqtt.bxmesh.net
  adminHostname: mqtt-admin.bxmesh.net   # behind Cloudflare Access (bxmesh/terraform)
  corescopeHostname: corescope.bxmesh.net

# Probes, from cluster-01's health checks (the edges' and dmz-controller's).
probes:
  readiness:  # the edge health check: every 5 s, 2 s timeout
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:   # dmz-controller's defaults: every 30 s, 5 s timeout, 6 failures
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

# Secrets, from OpenBao through External Secrets (spec: Security, secrets and access).
secrets:
  openbao:
    server: http://openbao-active.openbao.svc:8200
    path: secret
    authMountPath: kubernetes
  refreshInterval: 1h

# Backups (R15; cluster-docs spec/design.md, Storage: Backups; O265, O269, O270): each volume
# below, nightly, to the one R2 bucket by VolSync's restic mover (cluster-platform volsync/), and
# restored into a scratch volume and checked on the first Sunday of each month
# (templates/backups.yaml). The bucket, its token and restic's password come from OpenBao,
# secret/dmz-corescope/backups (cluster-terraform's stacks/cloudflare), never from here.
#
# The schedules are in UTC: VolSync's controller has no time-zone data (its 0.17.0 image), so it
# can't take a CRON_TZ= prefix. The volume backups are staggered over 16:00-16:45 UTC, which is
# 03:00-03:45 in Sydney in summer time (AEDT) and an hour earlier, 02:00-02:45, in winter (AEST).
backups:
  volumes:
    # CoreScope's SQLite database (corescope.data), as of one instant: a clone.
    - claim: corescope-data
      copyMethod: Clone
      uid: 1000
      gid: 1000
      fsGroup: 1000
      schedule: "15 16 * * *"
      scratch: {storageClassName: ceph-block, size: 50Gi}
    # EMQX's built-in database: logins, admin accounts (emqx.data).
    - claim: emqx-data
      copyMethod: Clone
      uid: 1000
      gid: 1000
      fsGroup: 1000
      schedule: "19 16 * * *"
      scratch: {storageClassName: ceph-block, size: 4Gi}
    # The Discord relay's last message per channel (discord.state).
    - claim: discord-relay-state
      copyMethod: Clone
      uid: 10001
      gid: 10001
      fsGroup: 10001
      schedule: "22 16 * * *"
      scratch: {storageClassName: ceph-block, size: 1Gi}
  # restic's cache, a claim VolSync makes per volume. Set here for every volume: left out, VolSync
  # gives it the source's access mode in the default class, and a CephFS volume's ReadWriteMany
  # on ceph-block is refused, so the cache never binds and the mover never starts (as happened to
  # zindello.com.au's first backup). The cache only speeds up the next run.
  cache:
    storageClassName: ceph-block
    accessModes: [ReadWriteOnce]
    capacity: 1Gi
  # The movers' limits (as cluster-platform #104 for Prometheus'): restic sizes its workers by
  # the CPUs it sees, and with no CPU limit it sees the whole node (48 on the R430) and was
  # OOM-killed at 1Gi. Go takes its GOMAXPROCS from the CPU limit, so 2 CPUs mean 2 workers. Every
  # volume here is well under 100 GB and 10,000 files, so 2Gi is ample. No requests, as before.
  moverResources:
    limits: {cpu: "2", memory: 2Gi}
  # Every volume: 30 daily copies (R15), pruned weekly.
  retain:
    daily: 30
  pruneIntervalDays: 7
  restoreTest:
    # The first Sunday of each month at 05:00 in Sydney (O270). The CronJob starts every Sunday
    # and tests only on the first (templates/backups.yaml).
    schedule: "0 5 * * 0"
    timeZone: Australia/Sydney
    # The newest snapshot must be from the night before.
    maxAgeHours: 26
    # VolSync's own image, the release cluster-platform installs (volsync/), pinned by tag and
    # digest (quay.io, read 4 November 2026): the same restic as the movers.
    image: quay.io/backube/volsync:0.17.0@sha256:bbc884d4fa108534260025bf1255a1010ebb6bb8dac9ba4f4a77f437ca7f8fbd
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      # The same CPU limit as the movers: it bounds restic's workers.
      limits: {cpu: "2", memory: 2Gi}

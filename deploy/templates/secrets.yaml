{{- $s := .Values.secrets }}
{{- $ns := .Release.Namespace }}
# External Secrets signs in to OpenBao as this service account, with the role named after the
# namespace, which may read only secret/dmz-corescope/... and secret/shared/bxmesh-broker/...
# (O72, O127; cluster-terraform's stacks/openbao/paths.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $s.openbao.server | quote }}
      path: {{ $s.openbao.path | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ $s.openbao.authMountPath | quote }}
          role: {{ $ns | quote }}
          serviceAccountRef:
            name: external-secrets
---
# EMQX's secrets, as the files its entrypoint reads in /srv/secrets: its Erlang cookie and first
# dashboard password; the API key (key:secret) it bootstraps, from the path it shares with
# bxmesh.net (O127); and CoreScope's broker login, which it seeds while that login doesn't exist.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: emqx
  data:
    - secretKey: emqx_cookie
      remoteRef:
        key: {{ $ns }}/emqx
        property: node_cookie
    - secretKey: emqx_dashboard_password
      remoteRef:
        key: {{ $ns }}/emqx
        property: dashboard_password
    - secretKey: emqx_api_key
      remoteRef:
        key: shared/bxmesh-broker/emqx
        property: api_key
    - secretKey: corescope_mqtt_password
      remoteRef:
        key: {{ $ns }}/corescope
        property: mqtt_password
---
# CoreScope's secrets, as the files its entrypoint reads in /srv/secrets: its admin API key and
# its subscribe-only broker login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: corescope
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: corescope
  data:
    - secretKey: corescope_api_key
      remoteRef:
        key: {{ $ns }}/corescope
        property: api_key
    - secretKey: mqtt_password_corescope
      remoteRef:
        key: {{ $ns }}/corescope
        property: mqtt_password

# CoreScope v3.15.0, as the image's user corescope (uid 1000; corescope/Dockerfile). No pod and
# no route while corescope.restored is false.
{{- $c := .Values.corescope }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corescope
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
    app.kubernetes.io/name: corescope
spec:
  replicas: {{ ternary 1 0 $c.restored }}
  strategy:
    type: Recreate  # one SQLite writer: never two pods at once
  selector:
    matchLabels:
      app.kubernetes.io/name: corescope
  template:
    metadata:
      labels:
        {{- include "corescope.labels" . | nindent 8 }}
        app.kubernetes.io/name: corescope
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "corescope.podSecurity" (dict "uid" 1000) | nindent 8 }}
      containers:
        # MQTT -> SQLite; owns the schema migrations.
        - name: ingestor
          image: {{ include "corescope.image" $c.image }}
          securityContext:
            {{- include "corescope.containerSecurity" . | nindent 12 }}
          env:
            - name: CORESCOPE_ROLE
              value: ingestor
            - name: BXMESH_BROKER
              value: {{ $c.broker | quote }}
          # No readiness check: a container's readiness is the whole pod's, so an ingestor cut off
          # from the broker would take CoreScope's pages offline, when the server can still show
          # everything stored. CoreScope already mends its own MQTT link: its watchdog checks the
          # connection every minute and forces a reconnect after 5 minutes of silence. So the
          # checks here are for the process itself stopping, from what it already writes: its
          # stats file, rewritten every second (CORESCOPE_INGESTOR_STATS, corescope/Dockerfile),
          # and in it watchdogLastTickUnix, which that watchdog stamps every minute (CoreScope's
          # own signal for a wedged watchdog). Restarting it restarts the ingestor alone.
          {{- $p := .Values.probes.ingestor }}
          # Started once the stats file is newer than the config.json the entrypoint renders at
          # each start: written by this run, not left by the last. Generous, so a release's
          # database copy and migrations are never cut short.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - '[ "$CORESCOPE_INGESTOR_STATS" -nt /app/config.json ]'
            {{- toYaml $p.startup | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  f=$CORESCOPE_INGESTOR_STATS; now=$(date +%s);
                  [ $(( now - $(stat -c %Y "$f") )) -lt {{ $p.statsStaleSeconds }} ] &&
                  tick=$(grep -o '"watchdogLastTickUnix":[0-9]*' "$f" | cut -d: -f2) &&
                  [ -n "$tick" ] && [ $(( now - tick )) -lt {{ $p.watchdogStaleSeconds }} ]
            {{- toYaml $p.liveness | nindent 12 }}
          resources:
            {{- toYaml $c.ingestor.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: secrets
              mountPath: /srv/secrets
              readOnly: true
        # The API and web UI.
        - name: server
          image: {{ include "corescope.image" $c.image }}
          securityContext:
            {{- include "corescope.containerSecurity" . | nindent 12 }}
          env:
            - name: CORESCOPE_ROLE
              value: server
            # The entrypoint renders config.json for both containers, so both need it.
            - name: BXMESH_BROKER
              value: {{ $c.broker | quote }}
            - name: GOMEMLIMIT
              value: {{ $c.server.gomemlimit | quote }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # 503 until its packet store has loaded: up to 900 s at start (services.yml's grace).
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml $c.server.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: secrets
              mountPath: /srv/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: corescope-data
        - name: secrets
          secret:
            secretName: corescope
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: corescope
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
    app.kubernetes.io/name: corescope
spec:
  selector:
    app.kubernetes.io/name: corescope
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# corescope-data: new and empty; its data comes back from the T620 when that moves (O94).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: corescope-data
  labels:
    {{- include "corescope.labels" . | nindent 4 }}
    app.kubernetes.io/name: corescope
  {{- include "corescope.keep" $c.data.keep | nindent 2 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $c.data.storageClassName }}
  resources:
    requests:
      storage: {{ $c.data.size }}

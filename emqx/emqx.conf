## BXMesh broker. Read-only settings: these win over anything changed in the
## dashboard (precedence: base.hocon < cluster.hocon < emqx.conf < env).

node {
  # Fixed, because the built-in database (users, admin accounts) is tied to
  # the node name, and a replacement container may get another address.
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = bxmesh
  discovery_strategy = manual
}

# Plain MQTT for CoreScope, on the DMZ only: the tunnel carries just HTTP(S).
listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

# Observers: MQTT over WebSockets. Cloudflare terminates TLS and the DMZ edges'
# Traefik forwards here. meshcoretomqtt only ever asks for "/" (openHop asks
# for "/mqtt", which the edges rewrite to "/").
listeners.ws.default {
  bind = "0.0.0.0:8083"
  websocket {
    mqtt_path = "/"
    proxy_address_header = "x-forwarded-for"
  }
}

listeners.ssl.default { enable = false }
listeners.wss.default { enable = false }

# The dashboard's first admin password; after that it lives in the database.
dashboard.default_password = "file:///run/emqx-secrets/dashboard_password"

# The API key the portal and the operator script use.
api_key.bootstrap_file = "/run/emqx-secrets/api_keys"

# One connection per login: the client ID becomes the username, whatever the
# client sends, and EMQX keeps one session per client ID. A second connection
# with the same login takes over and the first is dropped, so the newest wins
# (a rebooted observer reconnects straight away; two boxes sharing a login keep
# knocking each other off, which shows on the admin page).
mqtt.clientid_override = "username"

# Observers retain only their status (meshcoretomqtt's online/offline; openHop's
# with retain_status), one small message per node. Bounds in case a client
# retains more: a retained message expires a day after it was last published
# (live observers republish status well within that), a background sweep
# deletes expired ones, and the store and payloads are capped.
retainer {
  msg_expiry_interval = "1d"
  msg_clear_interval = "1h"
  max_payload_size = "64KB"
  backend.max_retained_messages = 10000
}

# Every client logs in with a username and password from the built-in database.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = pbkdf2
      mac_fun = sha256
      iterations = 4096
    }
    bootstrap_file = "/run/emqx-secrets/bootstrap_users.csv"
    bootstrap_type = plain
  }
]

# What each login may do: acl.conf. Anything it doesn't allow is refused.
authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = true }
  sources = [
    {
      type = file
      enable = true
      path = "${EMQX_ETC_DIR}/acl.conf"
    }
  ]
}

log.console {
  level = warning
}

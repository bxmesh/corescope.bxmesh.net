%% Who may do what on the BXMesh broker. Checked top to bottom; the first match
%% wins, and anything that matches nothing is refused (no_match = deny).

%% CoreScope reads everything observers send, and sends nothing.
{allow, {username, "corescope"}, subscribe, ["meshcore/#"]}.
{deny, {username, "corescope"}, publish, ["#"]}.

%% Observers only send: their packets and status, in the meshcoretomqtt /
%% LetsMesh layout, meshcore/BHS/<public key>/{packets,status}. Those are the
%% only topics openHop and meshcoretomqtt publish by default (meshcoretomqtt's
%% debug and openHop's neighbors are opt-in, and refused here).
{allow, all, publish, ["meshcore/BHS/+/packets", "meshcore/BHS/+/status"]}.

%% Everything else, every subscribe included (wildcards, $SYS, $share, their own
%% topics), is refused, so an observer login never receives anything: no live
%% messages, no retained ones, no other client's will. That keeps the broker
%% from ever being a two-way bridge.
{deny, all}.
